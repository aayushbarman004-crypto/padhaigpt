<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PadhaiGPT - Padhai ka AI saathi</title>
<meta name="description" content="PadhaiGPT: students ke liye free AI assistant. Concepts samjho, quiz do, previous year jaise sawal practice karo.">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--card:#f4f4f4;--me:#e8eefc;--line:#e2e2e2;--acc:#10a37f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#212121;--fg:#ececec;--mut:#9a9a9a;--card:#2f2f2f;--me:#303a55;--line:#3a3a3a;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
header b{font-size:17px}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px}
.ghost.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
select{flex:1 1 100%;min-width:0;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--me)}
.a{align-self:flex-start;background:var(--card)}
.empty{margin:auto;text-align:center;color:var(--mut)}
.empty h2{color:var(--fg);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:16px;padding:7px 12px;font-size:14px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:10px 14px;font:inherit;outline:none}
#send{background:var(--acc);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:18px}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<header><b>🎓 PadhaiGPT</b><button class="ghost" id="clear">Naya chat</button></header>
<div class="bar"><select id="lv"><option>Koi bhi level</option><option>Class 1-5</option><option>Class 6-8</option><option>Class 9-10</option><option>Class 11-12</option><option>College</option><option>JEE/NEET</option><option>UPSC/Govt exam</option></select><button class="ghost" id="qz">📝 Quiz: Off</button><button class="ghost" id="pq">🎯 PYQ: Off</button></div>
<div id="log"></div>
<form id="f"><textarea id="t" rows="1" placeholder="Padhai ka koi bhi sawal poochho..."></textarea><button id="send" type="submit" aria-label="Send">➤</button></form>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),send=document.getElementById('send');
let hist=[],busy=false,level='Koi bhi level',quiz=false,pyq=false;
const K='padhaigpt';
function save(){try{localStorage.setItem(K,JSON.stringify({hist:hist.slice(-30),level}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d){hist=Array.isArray(d.hist)?d.hist:[];level=d.level||level}}catch(e){}}
function bubble(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function empty(){log.innerHTML='';const e=document.createElement('div');e.className='empty';
e.innerHTML='<h2>Namaste 👋 Main PadhaiGPT hoon</h2><div>Padhai ho ya koi bhi sawal, poochho!</div><div class="chips"></div>';
['Photosynthesis simple me samjhao','Python seekhne ka plan banao','Exam ke liye study timetable','Quadratic equation solve karna sikhao'].forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>ask(s);e.querySelector('.chips').appendChild(b)});log.appendChild(e)}
async function ask(text){
 text=text.trim();if(!text||busy)return;
 if(!hist.length)log.innerHTML='';
 bubble('user',text);hist.push({role:'user',content:text});t.value='';t.style.height='auto';
 busy=true;send.disabled=true;const out=bubble('assistant','…');
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,level,quiz,pyq})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Error aaya.');
  out.textContent=d.text;hist.push({role:'assistant',content:d.text});save();
 }catch(e){out.textContent=e.message||'Error aaya. Dobara try karo.';hist.pop()}
 finally{busy=false;send.disabled=false;log.scrollTop=log.scrollHeight}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();ask(t.value)};
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();ask(t.value)}});
t.addEventListener('input',()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'});
document.getElementById('clear').onclick=()=>{hist=[];save();empty()};
document.getElementById('qz').onclick=function(){quiz=!quiz;this.classList.toggle('on',quiz);this.textContent='📝 Quiz: '+(quiz?'On':'Off')};
document.getElementById('pq').onclick=function(){pyq=!pyq;this.classList.toggle('on',pyq);this.textContent='🎯 PYQ: '+(pyq?'On':'Off')};
document.getElementById('lv').onchange=function(){level=this.value;save()};
load();document.getElementById('lv').value=level;
if(hist.length){log.innerHTML='';hist.forEach(m=>bubble(m.role,m.content))}else empty();
</script>
</body>
                                                                                                                                                                                                                                                                                                                       </html>
